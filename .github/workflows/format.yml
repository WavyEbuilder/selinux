name: Check format

on:
  push:
    branches:
      - clang-format
  pull_request:
    branches:
      - clang-format

jobs:
  check-format:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3
    steps:
      - uses: actions/checkout@v4
      - name: Check format
        run: make check-format
